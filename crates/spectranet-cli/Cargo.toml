[package]
name = "spectranet-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

description = "spectraNET command-line interface (snet)"

[[bin]]
name = "snet"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
spectranet-proto.workspace = true
spectranet-probe.workspace = true
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
serde_json = "1.0.151"
spectranet-capture.workspace = true
spectranet-model.workspace = true
thiserror = "2.0.21"
ratatui = "0.30.2"
spectranet-intel.workspace = true
jiff = "0.2.38"
signal-hook = "0.4.5"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
spectranet-daemon = { path = "../spectranet-daemon" }
tempfile = "3.27.0"
