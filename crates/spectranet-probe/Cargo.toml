[package]
name = "spectranet-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

description = "spectraNET network check: router, internet, DNS and path probes, and the diagnosis"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
spectranet-model.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
serde_json = "1.0.151"
