[package]
name = "spectranet-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.9.2"
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"] }
etherparse = "0.21.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
spectranet-model.workspace = true
sysinfo = { version = "0.39", default-features = false, features = ["system", "user"] }
thiserror = "2.0.21"
if-addrs = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2.190"
libloading = "0.8.9"
plist = "1.8.0"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
pcap = "2.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14.0"
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
ferrisetw = "1.2.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Security", "Win32_System_Rpc", "Win32_Networking_WinSock", "Win32_System_Diagnostics_Etw", "Win32_System_Threading"] }
